<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a05">
<title>MARS COLONY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#0a0505;color:#ffe8c8;
  touch-action:none;user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;font-size:14px;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);}

#topbar{
  flex-shrink:0;
  background:linear-gradient(180deg,rgba(30,12,8,.98),rgba(20,8,6,.92));
  border-bottom:1px solid rgba(255,140,80,.25);
  display:flex;align-items:center;padding:6px 8px;gap:6px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#topbar::-webkit-scrollbar{display:none}
.res{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:16px;
  background:rgba(60,25,15,.8);border:1px solid rgba(255,140,80,.2);
  flex-shrink:0;font-size:12px;font-weight:700;min-height:32px;transition:background .2s;}
.res.flash-good{animation:flashGood .5s}
.res.flash-bad{animation:flashBad .5s}
@keyframes flashGood{0%,100%{background:rgba(60,25,15,.8)}50%{background:rgba(80,200,80,.4)}}
@keyframes flashBad{0%,100%{background:rgba(60,25,15,.8)}50%{background:rgba(200,60,60,.5)}}
.res .icon{font-size:15px;line-height:1}
.res .val{color:#ffc890;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.res.low .val{color:#ff6060;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
#timebox{margin-left:auto;display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:16px;
  background:linear-gradient(90deg,rgba(80,40,20,.8),rgba(60,25,15,.8));
  border:1px solid rgba(255,140,80,.2);font-size:11px;font-weight:700;flex-shrink:0;}
#timebox .sol{color:#ffb060}
#timebox .tod{color:#a0a0ff;font-size:14px}

#canvasWrap{flex:1;position:relative;background:#3a1a10;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}

#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  max-width:90%;pointer-events:none;z-index:10;}
.toast{padding:8px 16px;background:rgba(30,12,8,.95);
  border:1px solid rgba(255,140,80,.4);border-left:3px solid #ff8040;
  border-radius:8px;font-size:12px;font-weight:600;color:#ffe8c8;
  box-shadow:0 4px 20px rgba(0,0,0,.6);animation:toastIn .3s ease-out;
  white-space:nowrap;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.toast.warn{border-left-color:#ffb040}
.toast.bad{border-left-color:#ff4040}
.toast.good{border-left-color:#60d080}

#info{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(40,16,10,.97),rgba(25,10,6,.97));
  border:1px solid rgba(255,140,80,.35);border-radius:12px;
  padding:10px 14px;min-width:200px;max-width:calc(100% - 20px);
  pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.7);
  display:none;z-index:8;animation:infoIn .2s ease-out;}
@keyframes infoIn{from{opacity:0;transform:translateX(-50%) scale(.95)}to{opacity:1;transform:translateX(-50%) scale(1)}}
#info.show{display:block}
#info .title{font-size:13px;font-weight:800;color:#ffb060;margin-bottom:6px;
  display:flex;align-items:center;gap:6px;}
#info .stats{font-size:11px;line-height:1.6;color:#d0b8a0;margin-bottom:8px;}
#info .stats b{color:#ffe8c8}
#info .stats .good{color:#60d080}
#info .stats .bad{color:#ff6060}
#info .actions{display:flex;gap:6px}
#info button{flex:1;padding:7px 12px;background:rgba(80,35,20,.9);
  border:1px solid rgba(255,140,80,.3);border-radius:8px;
  color:#ffd8a0;font-family:inherit;font-size:11px;font-weight:800;
  cursor:pointer;letter-spacing:.5px;min-height:36px;}
#info button.danger{background:rgba(80,20,15,.9);border-color:rgba(255,80,80,.35);color:#ff9090;}
#info button:active{transform:scale(.95)}

#toolbar{flex-shrink:0;
  background:linear-gradient(180deg,rgba(20,8,6,.92),rgba(30,12,8,.98));
  border-top:1px solid rgba(255,140,80,.25);padding:8px 0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#toolbar::-webkit-scrollbar{display:none}
#toolbarInner{display:flex;gap:6px;padding:0 10px;min-width:max-content;}
.bTile{width:72px;padding:6px 4px;
  background:linear-gradient(180deg,rgba(60,25,15,.9),rgba(40,16,10,.9));
  border:1px solid rgba(255,140,80,.25);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;flex-shrink:0;transition:all .15s;position:relative;}
.bTile:active{transform:scale(.94)}
.bTile.sel{border-color:#ffb060;
  box-shadow:0 0 0 2px rgba(255,176,96,.4),0 0 20px rgba(255,140,60,.3);
  background:linear-gradient(180deg,rgba(80,40,20,.95),rgba(60,25,15,.95));}
.bTile.disabled{opacity:.4;pointer-events:none}
.bTile .ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:26px;}
.bTile .nm{font-size:9px;font-weight:800;color:#ffd8a0;text-align:center;
  line-height:1.1;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%;}
.bTile .cost{font-size:9px;font-weight:700;color:#ff9060;margin-top:1px;}
.bTile .cost.ok{color:#80d080}

#start{position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 30%,#4a1810 0%,#1a0805 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;z-index:100;text-align:center;}
#start.hidden{display:none}
#start h1{font-size:clamp(28px,9vw,56px);font-weight:900;letter-spacing:6px;
  background:linear-gradient(180deg,#ffd090 0%,#ff8040 50%,#a04020 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 20px rgba(255,140,60,.5));
  margin-bottom:4px;font-family:'Arial Narrow',sans-serif;}
#start .sub{font-size:clamp(10px,3.5vw,14px);letter-spacing:8px;color:#c08060;margin-bottom:40px;}
#start .btn{padding:16px 44px;font-size:16px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(180deg,#ff8040,#a04020);border:none;border-radius:12px;
  color:#fff;box-shadow:0 6px 0 #5a2010,0 10px 30px rgba(255,100,40,.3);
  cursor:pointer;transition:all .1s;font-family:inherit;margin-bottom:12px;}
#start .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5a2010,0 4px 20px rgba(255,100,40,.3);}
#start .btn.secondary{background:linear-gradient(180deg,#604030,#3a2018);
  box-shadow:0 6px 0 #201008,0 10px 30px rgba(100,60,40,.3);color:#ffe0c0;}
#start .info{margin-top:24px;font-size:12px;color:#a08070;line-height:1.8;max-width:340px;}
#start .info b{color:#ffb060}
#start .saveInfo{margin-top:10px;font-size:11px;color:#80c080;}

#tint{position:absolute;inset:0;pointer-events:none;z-index:3;
  mix-blend-mode:multiply;opacity:0;transition:opacity 1s,background 1s;}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  font-size:10px;color:rgba(255,200,150,.5);letter-spacing:2px;
  pointer-events:none;z-index:4;font-weight:700;transition:opacity .6s;}

/* Tutorial overlay */
#tutorial{position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(30,15,10,.95);border:1px solid rgba(255,180,100,.4);
  border-radius:12px;padding:12px 16px;font-size:12px;color:#ffe8c8;
  z-index:9;pointer-events:none;opacity:0;transition:opacity .5s;
  max-width:90%;text-align:center;line-height:1.6;}
#tutorial.show{opacity:1}
#tutorial b{color:#ffb060}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="res" id="r-power"><span class="icon">⚡</span><span class="val">0</span></div>
    <div class="res" id="r-water"><span class="icon">💧</span><span class="val">0</span></div>
    <div class="res" id="r-oxygen"><span class="icon">🫁</span><span class="val">0</span></div>
    <div class="res" id="r-food"><span class="icon">🍎</span><span class="val">0</span></div>
    <div class="res" id="r-metal"><span class="icon">🔩</span><span class="val">0</span></div>
    <div class="res" id="r-pop"><span class="icon">👥</span><span class="val">0</span></div>
    <div id="timebox">
      <span class="sol" id="sol">SOL 1</span>
      <span class="tod" id="tod">🌅</span>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="tint"></div>
    <div id="toasts"></div>
    <div id="tutorial"></div>
    <div id="info">
      <div class="title"><span id="infoIcon">🏠</span><span id="infoName">Building</span></div>
      <div class="stats" id="infoStats"></div>
      <div class="actions">
        <button id="infoClose">Закрыть</button>
        <button id="infoDelete" class="danger">Снести</button>
      </div>
    </div>
    <div id="hint">СВАЙП — ДВИЖЕНИЕ · ЩИПОК — ЗУМ</div>
  </div>

  <div id="toolbar">
    <div id="toolbarInner"></div>
  </div>
</div>

<div id="start">
  <h1>MARS COLONY</h1>
  <div class="sub">К О Л О Н И З А Ц И Я</div>
  <button class="btn" id="startBtn">НОВАЯ ИГРА</button>
  <button class="btn secondary" id="continueBtn" style="display:none">ПРОДОЛЖИТЬ</button>
  <div class="info">
    <b>Тап по зданию внизу</b> — выбрать для постройки<br>
    <b>Тап по карте</b> — разместить / посмотреть<br>
    <b>Свайп</b> — сдвинуть · <b>Щипок</b> — зум<br>
    <span class="saveInfo" id="saveInfo"></span>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   CONFIG
   ========================================================= */
const GRID = 32;
const TILE = 40;
const MAX_ZOOM = 1.8;
const MIN_ZOOM = 0.35;
const TICK_MS = 1300;
const TICKS_PER_SOL = 40;
const SAVE_KEY = 'mars_colony_save_v2';

/* =========================================================
   BUILDINGS
   ========================================================= */
const BUILDINGS = {
  habitat: {
    name: 'Жилой модуль', icon: '🏠', size: 2,
    cost: { metal: 15 },
    power: -1, popCap: 8,
    color: '#c05838',
    desc: '+8 к лимиту колонистов',
  },
  solar: {
    name: 'Солнечная панель', icon: '☀️', size: 2,
    cost: { metal: 10 },
    power: 4, dayBonus: true,
    color: '#3070c0',
    desc: '+4 энергии днём (−75% ночью)',
  },
  ice: {
    name: 'Ледяной бур', icon: '💧', size: 2,
    cost: { metal: 15 },
    power: -1, water: 2, needs: 'ice',
    color: '#80c8d8',
    desc: '+2 воды. Ставится на лёд',
  },
  oxy: {
    name: 'Кислородный ген.', icon: '🫁', size: 2,
    cost: { metal: 20 },
    power: -2, water: -1, oxygen: 2,
    color: '#40b090',
    desc: '+2 кислорода. Тратит 1 воду',
  },
  green: {
    name: 'Теплица', icon: '🍎', size: 2,
    cost: { metal: 20 },
    power: -2, water: -1, food: 2,
    color: '#60c040',
    desc: '+2 еды. Тратит 1 воду',
  },
  mine: {
    name: 'Металл. шахта', icon: '⛏️', size: 2,
    cost: { metal: 15 },
    power: -1, metal: 2, needs: 'ore',
    color: '#b08858',
    desc: '+2 металла. Ставится на руду',
  },
  pad: {
    name: 'Посадочная площадка', icon: '🚀', size: 3,
    cost: { metal: 25 },
    power: 0, spawnsPop: true,
    color: '#909090',
    desc: 'Без неё колонисты не прилетают',
  },
  battery: {
    name: 'Батарея', icon: '🔋', size: 2,
    cost: { metal: 20 },
    power: 0, battery: 25,
    color: '#8060a0',
    desc: '+25 к буферу энергии',
  },
};

/* =========================================================
   STATE
   ========================================================= */
const state = {
  tiles: [],
  buildings: [],
  resources: {
    power: 15, water: 15, oxygen: 15,
    food: 15, metal: 60, pop: 2, popCap: 8,
  },
  camera: { x: 0, y: 0, zoom: 0.8 },
  time: 0,
  timeOfDay: 0.25,
  placingType: null,
  placingX: 0,
  placingY: 0,
  selectedId: -1,
  gameOver: false,
  nextId: 1,
  popGrowthTimer: 0,
  popShrinkTimer: 0,
  lastPopMilestone: 0,
  tutorialShown: false,
};

/* =========================================================
   CANVAS SETUP
   ========================================================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let VW = 0, VH = 0;

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  VW = wrap.clientWidth;
  VH = wrap.clientHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

/* =========================================================
   WORLD GEN
   ========================================================= */
function hash2(x, y, seed) {
  let h = x * 374761393 + y * 668265263 + seed * 2147483647;
  h = (h ^ (h >> 13)) * 1274126177;
  h = h ^ (h >> 16);
  return (h >>> 0) / 4294967295;
}
function noise2D(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi, seed);
  const b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed);
  const d = hash2(xi + 1, yi + 1, seed);
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y, seed, oct = 3) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    v += noise2D(x * f, y * f, seed + i * 7) * a;
    n += a; a *= 0.5; f *= 2;
  }
  return v / n;
}

function generateWorld() {
  state.tiles = [];
  for (let y = 0; y < GRID; y++) {
    const row = [];
    for (let x = 0; x < GRID; x++) {
      const n = fbm(x * 0.15, y * 0.15, 42, 3);
      const iceN = fbm(x * 0.22 + 100, y * 0.22 + 100, 88, 2);
      const oreN = fbm(x * 0.28 + 300, y * 0.28 + 300, 7, 2);
      let type = 'sand';
      if (n > 0.68) type = 'rock';
      else if (n < 0.32) type = 'dark';
      let deposit = null;
      if (iceN > 0.72) deposit = { kind: 'ice', amount: 40 + Math.floor(iceN * 60) };
      else if (oreN > 0.70) deposit = { kind: 'ore', amount: 30 + Math.floor(oreN * 50) };
      row.push({ type, deposit });
    }
    state.tiles.push(row);
  }
}

function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return null;
  return state.tiles[y][x];
}

/* =========================================================
   BUILDINGS
   ========================================================= */
function buildingAt(x, y) {
  for (const b of state.buildings) {
    if (x >= b.x && x < b.x + b.def.size && y >= b.y && y < b.y + b.def.size) return b;
  }
  return null;
}

function canPlace(type, tx, ty) {
  const def = BUILDINGS[type];
  if (!def) return false;
  const size = def.size;
  if (tx < 0 || ty < 0 || tx + size > GRID || ty + size > GRID) return false;
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      if (buildingAt(tx + dx, ty + dy)) return false;
    }
  }
  if (def.needs) {
    let found = false;
    for (let dy = 0; dy < size; dy++) {
      for (let dx = 0; dx < size; dx++) {
        const t = tileAt(tx + dx, ty + dy);
        if (t && t.deposit && t.deposit.kind === def.needs && t.deposit.amount > 0) {
          found = true; break;
        }
      }
      if (found) break;
    }
    if (!found) return false;
  }
  return true;
}

function placeBuilding(type, tx, ty, isFree = false) {
  const def = BUILDINGS[type];
  if (!def) return null;
  const cost = def.cost || {};
  if (!isFree) {
    for (const [k, v] of Object.entries(cost)) {
      if ((state.resources[k] || 0) < v) {
        toast(`Не хватает ${resourceLabel(k)}`, 'bad');
        return null;
      }
    }
    for (const [k, v] of Object.entries(cost)) {
      state.resources[k] -= v;
    }
  }
  const b = {
    id: state.nextId++,
    type, def,
    x: tx, y: ty,
    powered: true,
    spritePhase: Math.random() * Math.PI * 2,
  };
  state.buildings.push(b);
  return b;
}

function removeBuilding(id) {
  const i = state.buildings.findIndex(b => b.id === id);
  if (i >= 0) {
    const b = state.buildings[i];
    const cost = b.def.cost || {};
    for (const [k, v] of Object.entries(cost)) {
      state.resources[k] = (state.resources[k] || 0) + Math.floor(v * 0.5);
    }
    state.buildings.splice(i, 1);
    return true;
  }
  return false;
}

function resourceLabel(k) {
  return { power: 'энергии', water: 'воды', oxygen: 'кислорода',
           food: 'еды', metal: 'металла', pop: 'людей' }[k] || k;
}

/* =========================================================
   TICK
   ========================================================= */
function isDaytime() {
  return state.timeOfDay > 0.2 && state.timeOfDay < 0.75;
}

function tick() {
  if (state.gameOver) return;
  const R = state.resources;

  // Pass 1: calculate power production/consumption
  let powerProd = 0, powerCons = 0;
  let popCap = 0, hasPad = false;
  let batteryCap = 0;

  for (const b of state.buildings) {
    const p = b.def.power || 0;
    if (p > 0) {
      let out = p;
      if (b.def.dayBonus && !isDaytime()) out *= 0.25;
      powerProd += out;
    } else if (p < 0) {
      powerCons += -p;
    }
    if (b.def.popCap) popCap += b.def.popCap;
    if (b.def.spawnsPop) hasPad = true;
    if (b.def.battery) batteryCap += b.def.battery;
  }

  // Power available (battery + production)
  const totalAvailable = R.power + powerProd;
  const powerRatio = powerCons > 0 ? Math.min(1, totalAvailable / powerCons) : 1;
  const globalPowered = powerRatio > 0.15;

  // Pass 2: production
  let waterProd = 0, waterCons = 0;
  let oxygenProd = 0;
  let foodProd = 0;
  let metalProd = 0;

  for (const b of state.buildings) {
    const def = b.def;
    const powered = globalPowered;
    b.powered = powered;

    if (def.needs) {
      let rate = 0;
      const size = def.size;
      for (let dy = 0; dy < size; dy++) {
        for (let dx = 0; dx < size; dx++) {
          const t = tileAt(b.x + dx, b.y + dy);
          if (t && t.deposit && t.deposit.kind === def.needs && t.deposit.amount > 0) {
            rate += 1;
            t.deposit.amount = Math.max(0, t.deposit.amount - 0.08);
          }
        }
      }
      if (!powered) rate = 0;
      if (def.water) waterProd += def.water * rate * 0.5;
      if (def.metal) metalProd += def.metal * rate * 0.5;
    }

    if (def.oxygen && powered) oxygenProd += def.oxygen * powerRatio * 0.8;
    if (def.food && powered) foodProd += def.food * powerRatio * 0.8;
    if (def.water && !def.needs && powered) waterProd += def.water;
    if (def.water && def.water < 0 && powered) waterCons += -def.water;
  }

  // Population consumption — slower now
  const pop = R.pop;
  waterCons += pop * 0.15;
  const oxygenCons = pop * 0.15;
  const foodCons = pop * 0.15;

  // Apply
  const maxBattery = Math.max(50, 50 + batteryCap);
  const netPower = powerProd - powerCons;
  R.power = Math.max(0, Math.min(maxBattery, R.power + netPower));
  R.water = Math.max(0, Math.min(200, R.water + waterProd - waterCons));
  R.oxygen = Math.max(0, Math.min(200, R.oxygen + oxygenProd - oxygenCons));
  R.food = Math.max(0, Math.min(200, R.food + foodProd - foodCons));
  R.metal = Math.max(0, Math.min(300, R.metal + metalProd));
  R.popCap = popCap;

  // Population shrinking (needs oxygen AND food)
  if (R.food <= 0 || R.oxygen <= 0 || R.water <= 0) {
    state.popShrinkTimer++;
    if (state.popShrinkTimer >= 12) {
      state.popShrinkTimer = 0;
      if (R.pop > 0) {
        R.pop--;
        const cause = R.oxygen <= 0 ? 'от удушья' : R.food <= 0 ? 'от голода' : 'от жажды';
        toast(`Колонист погиб ${cause}`, 'bad');
      }
    }
  } else {
    state.popShrinkTimer = 0;
  }

  // Population growth — faster
  if (R.food > 4 && R.oxygen > 4 && R.water > 2 && R.pop < R.popCap && hasPad) {
    state.popGrowthTimer++;
    if (state.popGrowthTimer >= 6) {
      state.popGrowthTimer = 0;
      R.pop++;
      toast('Новый колонист прибыл', 'good');
      if (R.pop > state.lastPopMilestone) state.lastPopMilestone = R.pop;
    }
  } else {
    state.popGrowthTimer = 0;
  }

  updateTopbar();
}

/* =========================================================
   DRAW
   ========================================================= */
function worldToScreen(wx, wy) {
  return {
    x: (wx - state.camera.x) * state.camera.zoom + VW / 2,
    y: (wy - state.camera.y) * state.camera.zoom + VH / 2,
  };
}
function screenToWorld(sx, sy) {
  return {
    x: (sx - VW / 2) / state.camera.zoom + state.camera.x,
    y: (sy - VH / 2) / state.camera.zoom + state.camera.y,
  };
}

const TILE_COLORS = {
  sand: ['#c87650', '#b86840'],
  dark: ['#a85838', '#9a4e30'],
  rock: ['#8a5a48', '#7a4a3c'],
};

function draw() {
  ctx.fillStyle = '#3a1a10';
  ctx.fillRect(0, 0, VW, VH);

  const z = state.camera.zoom;
  const T = TILE * z;

  const tl = screenToWorld(0, 0);
  const br = screenToWorld(VW, VH);
  const x0 = Math.max(0, Math.floor(tl.x / TILE) - 1);
  const y0 = Math.max(0, Math.floor(tl.y / TILE) - 1);
  const x1 = Math.min(GRID - 1, Math.floor(br.x / TILE) + 1);
  const y1 = Math.min(GRID - 1, Math.floor(br.y / TILE) + 1);

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const t = state.tiles[ty][tx];
      const p = worldToScreen(tx * TILE, ty * TILE);
      const baseColors = TILE_COLORS[t.type] || TILE_COLORS.sand;
      const shade = ((tx * 7 + ty * 13) % 3 === 0) ? 1 : 0;
      ctx.fillStyle = baseColors[shade];
      ctx.fillRect(p.x, p.y, T + 1, T + 1);
      if (z > 0.5 && (tx + ty * 3) % 5 === 0) {
        ctx.fillStyle = 'rgba(0,0,0,.15)';
        const ds = Math.max(1, 2 * z);
        ctx.fillRect(p.x + T * 0.2, p.y + T * 0.3, ds, ds);
        ctx.fillRect(p.x + T * 0.6, p.y + T * 0.7, ds, ds);
      }
      if (t.deposit) {
        const dep = t.deposit;
        if (dep.kind === 'ice') {
          ctx.fillStyle = dep.amount > 0 ? 'rgba(180,220,240,.55)' : 'rgba(140,180,200,.25)';
          const cx = p.x + T / 2, cy = p.y + T / 2, r = T * 0.32;
          ctx.beginPath();
          ctx.moveTo(cx - r, cy);
          ctx.lineTo(cx - r * 0.4, cy - r * 0.8);
          ctx.lineTo(cx + r * 0.3, cy - r * 0.5);
          ctx.lineTo(cx + r, cy + r * 0.2);
          ctx.lineTo(cx + r * 0.2, cy + r * 0.7);
          ctx.lineTo(cx - r * 0.6, cy + r * 0.5);
          ctx.closePath();
          ctx.fill();
        } else if (dep.kind === 'ore') {
          ctx.fillStyle = dep.amount > 0 ? 'rgba(200,140,80,.55)' : 'rgba(140,100,60,.25)';
          const cx = p.x + T / 2, cy = p.y + T / 2, r = T * 0.28;
          for (let i = 0; i < 3; i++) {
            const a = i * 2.1 + tx;
            const rr = r * (0.6 + (i % 2) * 0.4);
            ctx.beginPath();
            ctx.arc(cx + Math.cos(a) * r * 0.4, cy + Math.sin(a) * r * 0.4, rr, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  if (state.placingType) {
    ctx.strokeStyle = 'rgba(255,180,100,.15)';
    ctx.lineWidth = 1;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const p = worldToScreen(tx * TILE, ty * TILE);
        ctx.strokeRect(p.x, p.y, T, T);
      }
    }
  }

  for (const b of state.buildings) drawBuilding(b);

  if (state.placingType) drawGhost();

  updateTint();
}

function drawBuilding(b) {
  const z = state.camera.zoom;
  const T = TILE * z;
  const size = b.def.size * T;
  const p = worldToScreen(b.x * TILE, b.y * TILE);
  if (p.x + size < -20 || p.y + size < -20 || p.x > VW + 20 || p.y > VH + 20) return;

  const isSel = state.selectedId === b.id;
  const powered = b.powered;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(p.x + size / 2, p.y + size * 0.95, size * 0.42, size * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = powered ? '#5a4a40' : '#3a3028';
  const padInset = T * 0.08;
  ctx.fillRect(p.x + padInset, p.y + padInset, size - padInset * 2, size - padInset * 2);

  drawBuildingShape(b, p.x, p.y, size, T, powered);

  if (isSel) {
    ctx.strokeStyle = '#ffb060';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.lineDashOffset = -performance.now() * 0.02;
    ctx.strokeRect(p.x, p.y, size, size);
    ctx.setLineDash([]);
  }
}

function drawBuildingShape(b, x, y, size, T, powered) {
  const cx = x + size / 2;
  const cy = y + size / 2;
  const phase = b.spritePhase;
  const t = performance.now() * 0.001;
  if (!powered) ctx.globalAlpha = 0.65;

  switch (b.type) {
    case 'habitat': {
      const r = size * 0.38;
      const grad = ctx.createRadialGradient(cx, cy - r * 0.3, 0, cx, cy, r * 1.2);
      grad.addColorStop(0, '#e09070'); grad.addColorStop(0.6, '#c05838'); grad.addColorStop(1, '#7a2c18');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5a2a18';
      ctx.fillRect(cx - r, cy - T * 0.1, r * 2, T * 0.15);
      ctx.fillStyle = powered ? '#ffe8a0' : '#403020';
      for (let i = -1; i <= 1; i++) ctx.fillRect(cx + i * T * 0.35 - T * 0.09, cy - r * 0.5, T * 0.18, T * 0.22);
      ctx.strokeStyle = '#c8c8d8';
      ctx.lineWidth = Math.max(1, T * 0.04);
      ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy - r - T * 0.4); ctx.stroke();
      if (powered && Math.sin(t * 3 + phase) > 0.3) {
        ctx.fillStyle = '#ff4040';
        ctx.beginPath(); ctx.arc(cx, cy - r - T * 0.4, T * 0.06, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'solar': {
      const pw = size * 0.72, ph = size * 0.45;
      const tilt = 0.2 + Math.sin(t * 0.5 + phase) * 0.05;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
      const isDay = isDaytime();
      const grad = ctx.createLinearGradient(0, -ph / 2, 0, ph / 2);
      grad.addColorStop(0, isDay ? '#5090e0' : '#203860');
      grad.addColorStop(1, isDay ? '#2a5a9a' : '#101a2a');
      ctx.fillStyle = grad;
      ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-pw / 2 + i * pw / 4, -ph / 2);
        ctx.lineTo(-pw / 2 + i * pw / 4, ph / 2);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(-pw / 2, 0); ctx.lineTo(pw / 2, 0); ctx.stroke();
      if (isDay) {
        ctx.fillStyle = 'rgba(255,255,255,.15)';
        ctx.fillRect(-pw / 2 + 2, -ph / 2 + 2, pw * 0.4, ph * 0.3);
      }
      ctx.restore();
      ctx.fillStyle = '#555';
      ctx.fillRect(cx - T * 0.04, cy + size * 0.15, T * 0.08, size * 0.18);
      break;
    }
    case 'ice': {
      const r = size * 0.22;
      ctx.fillStyle = '#3a7a8a';
      ctx.beginPath(); ctx.arc(cx, cy - size * 0.05, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#80d0e0';
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy - size * 0.05, r * 0.85, 0, Math.PI * 2); ctx.clip();
      ctx.fillRect(cx - r, cy - size * 0.05 + (1 - Math.min(1, state.resources.water / 100)) * r - r * 0.4, r * 2, r * 2);
      ctx.restore();
      ctx.fillStyle = '#808890';
      ctx.fillRect(cx - T * 0.06, cy - size * 0.35, T * 0.12, size * 0.3);
      if (powered) {
        ctx.fillStyle = 'rgba(200,240,255,.5)';
        ctx.beginPath(); ctx.arc(cx, cy + size * 0.15, T * 0.08, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'oxy': {
      for (let i = -1; i <= 1; i += 2) {
        const rx = cx + i * size * 0.18, ry = cy - size * 0.02, r = size * 0.14;
        ctx.fillStyle = '#2a8068';
        ctx.beginPath(); ctx.arc(rx, ry, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#40b090';
        ctx.beginPath(); ctx.arc(rx - r * 0.3, ry - r * 0.3, r * 0.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#a0a0a0';
      ctx.lineWidth = Math.max(1, T * 0.06);
      ctx.beginPath(); ctx.moveTo(cx - size * 0.25, cy); ctx.lineTo(cx + size * 0.25, cy); ctx.stroke();
      if (powered) {
        for (let i = 0; i < 3; i++) {
          const bt = (t * 0.5 + i * 0.3 + phase) % 1;
          const bx = cx + Math.cos(phase + i * 2) * size * 0.15;
          const by = cy - bt * size * 0.4;
          ctx.fillStyle = `rgba(150,240,210,${(1 - bt) * 0.5})`;
          ctx.beginPath(); ctx.arc(bx, by, T * 0.05 + bt * T * 0.04, 0, Math.PI * 2); ctx.fill();
        }
      }
      break;
    }
    case 'green': {
      const r = size * 0.4;
      const grad = ctx.createRadialGradient(cx, cy - r * 0.3, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(180,240,180,.65)');
      grad.addColorStop(0.6, 'rgba(100,200,100,.55)');
      grad.addColorStop(1, 'rgba(40,120,40,.7)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(200,220,200,.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - r); ctx.stroke();
      ctx.fillStyle = '#40b040';
      for (let i = -1; i <= 1; i++) {
        const px = cx + i * r * 0.4, py = cy - r * 0.3;
        ctx.beginPath(); ctx.arc(px, py, r * 0.15, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#4a3a28';
      ctx.fillRect(cx - r, cy - T * 0.08, r * 2, T * 0.12);
      break;
    }
    case 'mine': {
      ctx.fillStyle = '#6a4a30';
      ctx.fillRect(cx - size * 0.28, cy - size * 0.12, size * 0.56, size * 0.24);
      ctx.strokeStyle = '#a08050';
      ctx.lineWidth = Math.max(1, T * 0.05);
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.2, cy - size * 0.12);
      ctx.lineTo(cx, cy - size * 0.4);
      ctx.lineTo(cx + size * 0.2, cy - size * 0.12);
      ctx.stroke();
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(cx - T * 0.05, cy - size * 0.15, T * 0.1, size * 0.2);
      ctx.fillStyle = '#c08040';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(cx + (i - 1) * T * 0.12, cy + size * 0.2, T * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    case 'pad': {
      const r = size * 0.42;
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d0d0d0';
      ctx.lineWidth = Math.max(2, T * 0.05);
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.75, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - r * 0.5, cy); ctx.lineTo(cx + r * 0.5, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.5); ctx.lineTo(cx, cy + r * 0.5); ctx.stroke();
      const blink = Math.sin(t * 4 + phase) > 0;
      ctx.fillStyle = blink ? '#ffd040' : '#804020';
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, T * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    case 'battery': {
      const r = size * 0.3;
      ctx.fillStyle = '#504070';
      ctx.fillRect(cx - r, cy - r * 1.2, r * 2, r * 2.4);
      ctx.fillStyle = '#8060a0';
      ctx.fillRect(cx - r * 0.8, cy - r, r * 1.6, r * 2);
      // Fill level
      const lvl = Math.min(1, state.resources.power / 100);
      ctx.fillStyle = '#ffd040';
      ctx.fillRect(cx - r * 0.8, cy - r + (1 - lvl) * r * 2, r * 1.6, lvl * r * 2);
      // Lightning
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = Math.max(1.5, T * 0.06);
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.3, cy - r * 0.3);
      ctx.lineTo(cx + r * 0.1, cy);
      ctx.lineTo(cx - r * 0.1, cy + r * 0.3);
      ctx.stroke();
      break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawGhost() {
  const def = BUILDINGS[state.placingType];
  if (!def) return;
  const z = state.camera.zoom;
  const T = TILE * z;
  const size = def.size * T;
  const p = worldToScreen(state.placingX * TILE, state.placingY * TILE);
  const valid = canPlace(state.placingType, state.placingX, state.placingY);

  ctx.globalAlpha = 0.65;
  ctx.fillStyle = valid ? 'rgba(100,255,120,.35)' : 'rgba(255,80,80,.35)';
  ctx.fillRect(p.x, p.y, size, size);
  ctx.strokeStyle = valid ? '#80ff80' : '#ff6060';
  ctx.lineWidth = 3;
  ctx.strokeRect(p.x, p.y, size, size);

  const cornerSize = T * 0.3;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(p.x, p.y + cornerSize); ctx.lineTo(p.x, p.y); ctx.lineTo(p.x + cornerSize, p.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + size - cornerSize, p.y); ctx.lineTo(p.x + size, p.y); ctx.lineTo(p.x + size, p.y + cornerSize); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x, p.y + size - cornerSize); ctx.lineTo(p.x, p.y + size); ctx.lineTo(p.x + cornerSize, p.y + size); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + size - cornerSize, p.y + size); ctx.lineTo(p.x + size, p.y + size); ctx.lineTo(p.x + size, p.y + size - cornerSize); ctx.stroke();
  ctx.globalAlpha = 1;
}

function updateTint() {
  const tint = document.getElementById('tint');
  const t = state.timeOfDay;
  let opacity = 0;
  let color = 'rgba(0,0,0,0)';
  if (t < 0.15) { opacity = 0.5; color = '#203040'; }
  else if (t < 0.3) { opacity = 0.5 * (1 - (t - 0.15) / 0.15); color = '#203040'; }
  else if (t > 0.75) { opacity = 0.5 * Math.min(1, (t - 0.75) / 0.15); color = '#203040'; }
  tint.style.background = color;
  tint.style.opacity = opacity;
}

/* =========================================================
   TOPBAR UI
   ========================================================= */
const $power = document.getElementById('r-power');
const $water = document.getElementById('r-water');
const $oxygen = document.getElementById('r-oxygen');
const $food = document.getElementById('r-food');
const $metal = document.getElementById('r-metal');
const $pop = document.getElementById('r-pop');
const prevRes = { power: 0, water: 0, oxygen: 0, food: 0, metal: 0, pop: 0 };

function updateTopbar() {
  const R = state.resources;
  setRes($power, Math.floor(R.power), prevRes.power, 'power');
  setRes($water, Math.floor(R.water), prevRes.water, 'water');
  setRes($oxygen, Math.floor(R.oxygen), prevRes.oxygen, 'oxygen');
  setRes($food, Math.floor(R.food), prevRes.food, 'food');
  setRes($metal, Math.floor(R.metal), prevRes.metal, 'metal');
  $pop.querySelector('.val').textContent = `${R.pop}/${R.popCap}`;
  $water.classList.toggle('low', R.water < 3);
  $oxygen.classList.toggle('low', R.oxygen < 3);
  $food.classList.toggle('low', R.food < 3);
  $power.classList.toggle('low', R.power < 3);

  const sol = Math.floor(state.time / TICKS_PER_SOL) + 1;
  document.getElementById('sol').textContent = `SOL ${sol}`;
  const tod = state.timeOfDay;
  let icon = '🌅';
  if (tod < 0.2) icon = '🌌';
  else if (tod < 0.35) icon = '🌅';
  else if (tod < 0.6) icon = '☀️';
  else if (tod < 0.75) icon = '🌇';
  else icon = '🌌';
  document.getElementById('tod').textContent = icon;
}

function setRes(el, val, prev, key) {
  const $v = el.querySelector('.val');
  if ($v.textContent !== String(val)) $v.textContent = val;
  if (val > prev) {
    el.classList.remove('flash-bad');
    el.classList.add('flash-good');
    setTimeout(() => el.classList.remove('flash-good'), 500);
  } else if (val < prev) {
    el.classList.remove('flash-good');
    el.classList.add('flash-bad');
    setTimeout(() => el.classList.remove('flash-bad'), 500);
  }
  prevRes[key] = val;
}

/* =========================================================
   TOOLBAR
   ========================================================= */
function buildToolbar() {
  const inner = document.getElementById('toolbarInner');
  inner.innerHTML = '';
  for (const [key, def] of Object.entries(BUILDINGS)) {
    const el = document.createElement('div');
    el.className = 'bTile';
    el.dataset.type = key;
    const costStr = Object.entries(def.cost || {}).map(([k, v]) => {
      const icon = { metal: '🔩', water: '💧', power: '⚡', food: '🍎', oxygen: '🫁' }[k] || k;
      return `${icon}${v}`;
    }).join(' ');
    el.innerHTML = `
      <div class="ic">${def.icon}</div>
      <div class="nm">${def.name}</div>
      <div class="cost">${costStr || '—'}</div>
    `;
    el.addEventListener('click', () => selectBuildingType(key));
    inner.appendChild(el);
  }
}

function selectBuildingType(type) {
  if (state.placingType === type) {
    state.placingType = null;
  } else {
    state.placingType = type;
    state.selectedId = -1;
    hideInfo();
    const centerWorld = screenToWorld(VW / 2, VH / 2);
    const def = BUILDINGS[type];
    state.placingX = Math.max(0, Math.min(GRID - def.size, Math.floor(centerWorld.x / TILE - def.size / 2)));
    state.placingY = Math.max(0, Math.min(GRID - def.size, Math.floor(centerWorld.y / TILE - def.size / 2)));
    toast(`Тапните по карте, чтобы построить ${def.name}`, 'warn');
  }
  refreshToolbarSelection();
}

function refreshToolbarSelection() {
  document.querySelectorAll('.bTile').forEach(el => {
    el.classList.toggle('sel', el.dataset.type === state.placingType);
    const def = BUILDINGS[el.dataset.type];
    if (def) {
      const costOk = Object.entries(def.cost || {}).every(([k, v]) => (state.resources[k] || 0) >= v);
      el.classList.toggle('disabled', !costOk);
      const costEl = el.querySelector('.cost');
      if (costEl) costEl.classList.toggle('ok', costOk);
    }
  });
}

/* =========================================================
   INFO PANEL
   ========================================================= */
function showInfo(b) {
  state.selectedId = b.id;
  const info = document.getElementById('info');
  document.getElementById('infoIcon').textContent = b.def.icon;
  document.getElementById('infoName').textContent = b.def.name;
  const stats = [];
  if (b.def.power) stats.push(`⚡ ${b.def.power > 0 ? '+' : ''}${b.def.power}`);
  if (b.def.water) stats.push(`💧 ${b.def.water > 0 ? '+' : ''}${b.def.water}`);
  if (b.def.oxygen) stats.push(`🫁 +${b.def.oxygen}`);
  if (b.def.food) stats.push(`🍎 +${b.def.food}`);
  if (b.def.metal) stats.push(`🔩 +${b.def.metal}`);
  if (b.def.popCap) stats.push(`👥 +${b.def.popCap}`);
  if (b.def.battery) stats.push(`🔋 +${b.def.battery}`);

  let html = stats.join(' · ') || '—';
  if (b.def.needs) {
    let totalRemain = 0;
    const size = b.def.size;
    for (let dy = 0; dy < size; dy++) {
      for (let dx = 0; dx < size; dx++) {
        const t = tileAt(b.x + dx, b.y + dy);
        if (t && t.deposit && t.deposit.kind === b.def.needs) totalRemain += Math.max(0, t.deposit.amount);
      }
    }
    html += `<br>Требует: ${b.def.needs === 'ice' ? 'лёд' : 'руду'}`;
    if (totalRemain > 0) html += ` (запас: ${Math.round(totalRemain)})`;
    else html += ` <span class="bad">(истощён)</span>`;
  }
  if (!b.powered) html += `<br><span class="bad">⚠ Нет питания</span>`;
  document.getElementById('infoStats').innerHTML = html;
  info.classList.add('show');
}

function hideInfo() {
  state.selectedId = -1;
  document.getElementById('info').classList.remove('show');
}
document.getElementById('infoClose').addEventListener('click', hideInfo);
document.getElementById('infoDelete').addEventListener('click', () => {
  if (state.selectedId >= 0) {
    removeBuilding(state.selectedId);
    hideInfo();
    toast('Здание снесено (возврат 50%)', 'warn');
    updateTopbar();
    refreshToolbarSelection();
    saveGame();
  }
});

/* =========================================================
   INPUT
   ========================================================= */
const pointers = new Map();
let dragStartX = 0, dragStartY = 0;
let camStartX = 0, camStartY = 0;
let isDragging = false;
let dragMoved = false;
let pinchStartDist = 0;
let pinchStartZoom = 1;
let lastTapTime = 0;

canvas.addEventListener('pointerdown', (e) => {
  if (state.gameOver) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    camStartX = state.camera.x;
    camStartY = state.camera.y;
    isDragging = true;
    dragMoved = false;
  } else if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    pinchStartZoom = state.camera.zoom;
    isDragging = false;
    dragMoved = true;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && isDragging) {
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.abs(dx) + Math.abs(dy) > 8) dragMoved = true;
    state.camera.x = camStartX - dx / state.camera.zoom;
    state.camera.y = camStartY - dy / state.camera.zoom;
    clampCamera();
  } else if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (pinchStartDist > 0) {
      let newZoom = pinchStartZoom * (dist / pinchStartDist);
      newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
      // If clamped, reset baseline so pinch feels responsive after hitting limit
      if (newZoom !== pinchStartZoom * (dist / pinchStartDist)) {
        pinchStartDist = dist;
        pinchStartZoom = newZoom;
      }
      state.camera.zoom = newZoom;
      clampCamera();
    }
  }
});

canvas.addEventListener('pointerup', (e) => {
  const wasSizeBefore = pointers.size;
  const wasDragging = isDragging;
  const wasMoved = dragMoved;
  pointers.delete(e.pointerId);

  if (wasSizeBefore === 1 && !wasMoved && wasDragging) {
    handleTap(e.clientX, e.clientY);
  }

  // Transition from 2 fingers to 1 — restart single-finger drag
  if (pointers.size === 1) {
    const [p] = [...pointers.values()];
    dragStartX = p.x;
    dragStartY = p.y;
    camStartX = state.camera.x;
    camStartY = state.camera.y;
    isDragging = true;
    dragMoved = true; // prevent accidental tap on finger lift
  }

  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) isDragging = false;
});

canvas.addEventListener('pointercancel', (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
  if (pointers.size === 0) isDragging = false;
});

function handleTap(sx, sy) {
  const rect = canvas.getBoundingClientRect();
  const lx = sx - rect.left;
  const ly = sy - rect.top;
  const w = screenToWorld(lx, ly);
  const tx = Math.floor(w.x / TILE);
  const ty = Math.floor(w.y / TILE);
  if (tx < 0 || ty < 0 || tx >= GRID || ty >= GRID) return;

  if (state.placingType) {
    const def = BUILDINGS[state.placingType];
    const tx2 = Math.max(0, Math.min(GRID - def.size, tx - Math.floor(def.size / 2)));
    const ty2 = Math.max(0, Math.min(GRID - def.size, ty - Math.floor(def.size / 2)));
    state.placingX = tx2;
    state.placingY = ty2;
    if (canPlace(state.placingType, tx2, ty2)) {
      const placed = placeBuilding(state.placingType, tx2, ty2);
      if (placed) {
        toast(`${def.name} построено`, 'good');
        updateTopbar();
        refreshToolbarSelection();
        state.placingType = null;
        refreshToolbarSelection();
        saveGame();
        checkTutorialProgress();
      }
    } else {
      const reason = def.needs ? `Нужен ${def.needs === 'ice' ? 'лёд' : 'руда'}` : 'Здесь нельзя';
      toast(reason, 'bad');
    }
    return;
  }

  const b = buildingAt(tx, ty);
  if (b) showInfo(b);
  else hideInfo();
}

function clampCamera() {
  const halfW = VW / 2 / state.camera.zoom;
  const halfH = VH / 2 / state.camera.zoom;
  const worldSize = GRID * TILE;
  const pad = 3 * TILE;
  state.camera.x = Math.max(-pad + halfW, Math.min(worldSize + pad - halfW, state.camera.x));
  state.camera.y = Math.max(-pad + halfH, Math.min(worldSize + pad - halfH, state.camera.y));
}

/* =========================================================
   TOASTS
   ========================================================= */
const toastsContainer = document.getElementById('toasts');
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  toastsContainer.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-10px)';
    setTimeout(() => el.remove(), 350);
  }, 2500);
  while (toastsContainer.children.length > 4) toastsContainer.firstChild.remove();
}

/* =========================================================
   TUTORIAL
   ========================================================= */
const tutorialQueue = [
  { text: '👋 <b>Свайпай</b> одним пальцем, чтобы двигать карту. <b>Щипок</b> — зум.', once: true },
  { text: '⚡ Ты уже с 7 зданиями. Следи за <b>ресурсами</b> вверху.', once: true, delay: 4000 },
  { text: '🔩 Не хватает металла — построй <b>Шахту</b> на оранжевых пятнах руды.', once: true, delay: 6000 },
  { text: '🚀 Колонисты прилетают только если есть <b>посадочная площадка</b>.', once: true, delay: 6000 },
];

let tutorialIndex = 0;
function showTutorial(text) {
  const el = document.getElementById('tutorial');
  el.innerHTML = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 4500);
}
function nextTutorial() {
  if (tutorialIndex >= tutorialQueue.length) return;
  const t = tutorialQueue[tutorialIndex++];
  setTimeout(() => showTutorial(t.text), t.delay || 0);
}
function checkTutorialProgress() {
  // Could trigger more tips based on milestones
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function saveGame() {
  try {
    const save = {
      v: 2,
      tiles: state.tiles.map(row => row.map(t => ({
        type: t.type,
        deposit: t.deposit ? { kind: t.deposit.kind, amount: Math.round(t.deposit.amount) } : null,
      }))),
      buildings: state.buildings.map(b => ({ id: b.id, type: b.type, x: b.x, y: b.y })),
      resources: { ...state.resources },
      camera: { x: state.camera.x, y: state.camera.y, zoom: state.camera.zoom },
      time: state.time,
      timeOfDay: state.timeOfDay,
      nextId: state.nextId,
      tutorialShown: state.tutorialShown,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) { /* storage full or unavailable */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const save = JSON.parse(raw);
    if (!save || save.v !== 2) return null;
    return save;
  } catch (e) { return null; }
}

function applySave(save) {
  state.tiles = save.tiles;
  state.buildings = save.buildings
    .filter(b => BUILDINGS[b.type])
    .map(b => ({
      id: b.id,
      type: b.type,
      def: BUILDINGS[b.type],
      x: b.x, y: b.y,
      powered: true,
      spritePhase: Math.random() * Math.PI * 2,
    }));
  state.resources = { ...save.resources };
  state.camera = { ...save.camera };
  state.time = save.time || 0;
  state.timeOfDay = save.timeOfDay || 0.25;
  state.nextId = save.nextId || 1;
  state.tutorialShown = save.tutorialShown || false;
}

function hasSave() {
  return loadGame() !== null;
}

/* =========================================================
   START
   ========================================================= */
function findNearbyDeposit(tiles, cx, cy, kind, maxR = 8) {
  // Spiral search for closest deposit
  for (let r = 0; r <= maxR; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= GRID || y >= GRID) continue;
        const t = tiles[y][x];
        if (t.deposit && t.deposit.kind === kind && t.deposit.amount > 0) {
          return { x, y };
        }
      }
    }
  }
  return null;
}

function startNewGame() {
  generateWorld();

  const cx = Math.floor(GRID / 2);
  const cy = Math.floor(GRID / 2);

  // Reset resources for new game
  state.resources = {
    power: 15, water: 15, oxygen: 15,
    food: 15, metal: 60, pop: 2, popCap: 8,
  };
  state.buildings = [];
  state.time = 0;
  state.timeOfDay = 0.25;
  state.nextId = 1;
  state.tutorialShown = false;

  // Clear the area around center for buildings
  for (let y = cy - 6; y <= cy + 6; y++) {
    for (let x = cx - 6; x <= cx + 6; x++) {
      if (x < 0 || y < 0 || x >= GRID || y >= GRID) continue;
      if (state.tiles[y][x].type === 'rock') state.tiles[y][x].type = 'sand';
    }
  }

  // Pre-build starting base (all free)
  const padX = cx - 1, padY = cy - 1;
  placeBuilding('pad', padX, padY, true);

  // Habitat top-left of pad
  placeBuilding('habitat', padX - 3, padY, true);
  // Solar panels to the left
  placeBuilding('solar', padX - 3, padY + 3, true);
  placeBuilding('solar', padX - 5, padY + 3, true);
  // Oxy + Green to the right
  placeBuilding('oxy', padX + 4, padY, true);
  placeBuilding('green', padX + 4, padY + 3, true);

  // Ice drill — find nearest ice deposit
  const iceSpot = findNearbyDeposit(state.tiles, cx, cy, 'ice', 10);
  if (iceSpot) {
    // Ensure deposit exists
    const t = state.tiles[iceSpot.y][iceSpot.x];
    if (!t.deposit || t.deposit.amount <= 0) t.deposit = { kind: 'ice', amount: 60 };
    // Clear rocks around
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const x = iceSpot.x + dx, y = iceSpot.y + dy;
        if (x < 0 || y < 0 || x >= GRID || y >= GRID) continue;
        if (state.tiles[y][x].type === 'rock') state.tiles[y][x].type = 'sand';
      }
    }
    placeBuilding('ice', iceSpot.x, iceSpot.y, true);
  } else {
    // Fallback: force an ice deposit near center
    const fx = cx + 5, fy = cy - 5;
    if (state.tiles[fy] && state.tiles[fy][fx]) {
      state.tiles[fy][fx].deposit = { kind: 'ice', amount: 80 };
      state.tiles[fy][fx].type = 'sand';
      placeBuilding('ice', fx, fy, true);
    }
  }

  // Camera
  state.camera.x = (padX + 1.5) * TILE;
  state.camera.y = (padY + 1.5) * TILE;
  state.camera.zoom = 0.8;
  clampCamera();

  state.placingType = null;
  state.selectedId = -1;
  state.popGrowthTimer = 0;
  state.popShrinkTimer = 0;
  state.lastPopMilestone = 0;

  tick(); // compute popCap
  updateTopbar();
  refreshToolbarSelection();
}

function continueGame(save) {
  applySave(save);
  clampCamera();
  tick();
  updateTopbar();
  refreshToolbarSelection();
}

/* =========================================================
   UI WIRING
   ========================================================= */
let running = false;

function beginPlay(fromSave) {
  document.getElementById('start').classList.add('hidden');
  document.getElementById('hint').style.opacity = '1';
  setTimeout(() => document.getElementById('hint').style.opacity = '0', 5000);
  running = true;
  lastTickTime = performance.now();
  draw();
  if (!fromSave) {
    tutorialIndex = 0;
    nextTutorial();
  }
}

document.getElementById('startBtn').addEventListener('click', () => {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  startNewGame();
  beginPlay(false);
  saveGame();
});

document.getElementById('continueBtn').addEventListener('click', () => {
  const save = loadGame();
  if (save) {
    continueGame(save);
    beginPlay(true);
  }
});

/* =========================================================
   AUTOSAVE
   ========================================================= */
let saveTimer = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (running) saveGame();
    running = false;
  } else if (document.getElementById('start').classList.contains('hidden')) {
    running = true;
    lastTickTime = performance.now();
  }
});
window.addEventListener('pagehide', () => { if (running) saveGame(); });
window.addEventListener('beforeunload', () => { if (running) saveGame(); });

/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastTickTime = 0;
let lastDrawTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  if (!running) return;

  if (now - lastTickTime > TICK_MS) {
    lastTickTime = now;
    tick();
    state.time++;
    state.timeOfDay = (state.time % TICKS_PER_SOL) / TICKS_PER_SOL;

    // Autosave every ~5s
    saveTimer += TICK_MS;
    if (saveTimer >= 5000) {
      saveTimer = 0;
      saveGame();
    }
  }

  // Draw at 30fps (enough for smooth feel, saves battery)
  if (now - lastDrawTime > 33) {
    lastDrawTime = now;
    draw();
  }
}

/* =========================================================
   BOOT
   ========================================================= */
function boot() {
  resizeCanvas();
  buildToolbar();

  // Check for existing save
  const save = loadGame();
  if (save) {
    document.getElementById('continueBtn').style.display = 'block';
    const sol = Math.floor((save.time || 0) / TICKS_PER_SOL) + 1;
    const pop = save.resources.pop;
    document.getElementById('saveInfo').innerHTML =
      `💾 Сохранение: <b>SOL ${sol}</b> · 👥 ${pop} колонистов`;
  }

  setTimeout(resizeCanvas, 100);
  requestAnimationFrame(loop);
}

boot();

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  if (e.target === canvas) e.preventDefault();
}, { passive: false });

</script>
